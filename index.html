<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С 8 марта, Денчик!</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; font-family:'Arial', sans-serif; }

/* Черный экран в начале */
#blackScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:black; display:flex; justify-content:center; align-items:center; z-index:3000;
}

/* Начальный текст */
#startText { font-size:3em; font-weight:bold; color:white; }

/* Основной фон */
#mainScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:url('images/img1.jpg') no-repeat center center/cover;
    display:none;
}

/* Капли */
.ripple { position:absolute; width:20px; height:20px; background:rgba(255,255,255,0.6); border-radius:50%; transform:scale(0); animation:rippleAnim 0.6s linear; pointer-events:none; }
@keyframes rippleAnim { to { transform:scale(15); opacity:0; } }

/* Эффект огня */
.fire {
    position:fixed; top:0; width:60px; height:100%;
    background: linear-gradient(to bottom, rgba(255,150,0,0.8), rgba(255,0,0,0.5));
    animation: fireAnim 0.4s infinite alternate; z-index:500;
}
.fire.left { left:0; }
.fire.right { right:0; }
@keyframes fireAnim { 0%{opacity:0.5;} 50%{opacity:0.9;} 100%{opacity:0.5;} }

/* Тряска экрана */
.shake { animation:shakeAnim 0.1s infinite; }
@keyframes shakeAnim {
    0%{transform:translate(0,0);} 25%{transform:translate(2px,-2px);}
    50%{transform:translate(-2px,2px);} 75%{transform:translate(2px,2px);} 100%{transform:translate(0,0);}
}

/* Анимация взрыва картинок */
.boomImg {
    position:absolute;
    width:60px; height:60px;
    z-index:1500;
    animation:boomAnim 0.5s infinite alternate;
}
@keyframes boomAnim {
    0% { transform: scale(1) rotate(0deg); opacity: 1; }
    25% { transform: scale(1.3) rotate(15deg); opacity: 0.8; }
    50% { transform: scale(0.8) rotate(-15deg); opacity: 0.6; }
    75% { transform: scale(1.4) rotate(25deg); opacity: 0.9; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

/* Стробоскоп оранжево-персиковый */
#strobo {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(45deg, rgba(255,180,120,0.3), rgba(255,200,150,0.3));
    opacity:0; pointer-events:none; z-index:2500;
    animation:stroboAnim 0.1s infinite alternate;
}
@keyframes stroboAnim {
    0% {opacity:0;}
    50% {opacity:0.2;}
    100% {opacity:0;}
}
</style>
</head>
<body>

<!-- Черный экран и текст -->
<div id="blackScreen"><div id="startText">ЖМЯК НА МЕНЯ</div></div>

<!-- Основной фон -->
<div id="mainScreen"></div>

<!-- Стробоскоп -->
<div id="strobo"></div>

<!-- Музыка -->
<audio id="bgMusic" src="music/mus1.mp3" loop></audio>

<!-- Эффект огня -->
<div class="fire left"></div>
<div class="fire right"></div>

<script>
document.body.addEventListener('click', function(e){
    // Черный экран исчезает
    document.getElementById('blackScreen').style.display='none';
    document.getElementById('mainScreen').style.display='block';

    // Экран трясется
    document.body.classList.add('shake');

    // Капля
    const ripple = document.createElement('div');
    ripple.classList.add('ripple');
    ripple.style.left=`${e.clientX-10}px`;
    ripple.style.top=`${e.clientY-10}px`;
    document.body.appendChild(ripple);
    setTimeout(()=>{ ripple.remove(); },600);

    // Стробоскоп оранжево-персиковый
    document.getElementById('strobo').style.opacity=1;

    // Музыка
    const music=document.getElementById('bgMusic');
    if(music.paused){
        music.play().then(()=>{
            music.volume=0;
            const target=0.25;
            const dur=3000;
            const interval=50;
            const steps=dur/interval;
            const incr=target/steps;
            let vol=0;
            const fade=setInterval(()=>{
                vol+=incr;
                if(vol>=target){vol=target; clearInterval(fade);}
                music.volume=vol;
            }, interval);
        });
    }

    // Картинки взрывов по бокам
    const imgCount=Math.floor(window.innerHeight/60);
    for(let i=0;i<imgCount;i++){
        const imgLeft=document.createElement('img');
        imgLeft.src='images/img2.png';
        imgLeft.classList.add('boomImg');
        imgLeft.style.left='0px';
        imgLeft.style.top=`${i*60}px`;
        imgLeft.style.animationDuration=`${0.2+Math.random()*0.3}s`;
        document.body.appendChild(imgLeft);

        const imgRight=document.createElement('img');
        imgRight.src='images/img2.png';
        imgRight.classList.add('boomImg');
        imgRight.style.right='0px';
        imgRight.style.top=`${i*60}px`;
        imgRight.style.animationDuration=`${0.2+Math.random()*0.3}s`;
        document.body.appendChild(imgRight);
    }

},{once:true});
</script>

</body>
</html>
